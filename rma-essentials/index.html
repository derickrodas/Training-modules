<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>RMA Essentials: Submitting &amp; Explaining Returns</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--card2:#273549;--accent:#3b82f6;--accent2:#2563eb;--good:#22c55e;--bad:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--line:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;justify-content:center;padding:24px}
#player{width:100%;max-width:860px}.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.topbar h1{font-size:16px;margin:0;font-weight:600;color:var(--muted)}
.progress{flex:1;height:8px;background:var(--card);border-radius:99px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.pct{font-size:13px;color:var(--muted);min-width:38px;text-align:right}
.stage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px;min-height:380px;display:flex;flex-direction:column}
.stage h2{margin:0 0 6px;font-size:26px}.stage .sub{color:var(--muted);margin-bottom:20px}.body{flex:1;font-size:16px;line-height:1.6}.body p{margin:0 0 14px}
.media{width:100%;border-radius:12px;margin:8px 0 18px;display:block}
.content-media{width:100%;border-radius:12px;margin:4px 0 18px;display:block}
.narration{width:100%;margin-bottom:16px;height:40px}
.body ul{margin:0 0 14px;padding-left:22px}.body li{margin:5px 0}.body a{color:var(--accent)}.body strong{color:#fff}
.hotspot-wrap{position:relative;display:inline-block;width:100%}
.hotspot{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--accent);border:3px solid #fff;cursor:pointer;animation:pulse 2s infinite;transform:translate(-50%,-50%)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}70%{box-shadow:0 0 0 14px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
.tip{background:var(--card2);border-left:4px solid var(--accent);padding:14px 16px;border-radius:8px;margin-top:16px;min-height:20px;color:var(--muted)}.tip.active{color:var(--text)}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.choice{text-align:left;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px;cursor:pointer;transition:.15s}
.choice:hover{border-color:var(--accent);transform:translateY(-1px)}.choice.correct{border-color:var(--good);background:rgba(34,197,94,.12)}.choice.wrong{border-color:var(--bad);background:rgba(239,68,68,.12)}.choice.disabled{pointer-events:none;opacity:.7}.choice.sel{border-color:var(--accent);background:rgba(59,130,246,.18)}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px;display:none}.feedback.show{display:block}.feedback.ok{background:rgba(34,197,94,.12);border:1px solid var(--good)}.feedback.no{background:rgba(239,68,68,.12);border:1px solid var(--bad)}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:12px}
button.btn{background:var(--accent);color:#fff;border:0;padding:12px 26px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}button.btn:hover{background:var(--accent2)}button.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}button.btn:disabled{opacity:.4;cursor:not-allowed}button.btn.check{padding:9px 20px;font-size:14px}
.badge{display:inline-block;font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px}
.result-score{font-size:52px;font-weight:800;margin:10px 0}.center{text-align:center;align-items:center;justify-content:center}
.sim-prompt{font-size:17px;font-weight:600;margin:0 0 14px;color:var(--text)}.sim-stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line)}.sim-img{width:100%;display:block}.sim-layer{position:absolute;inset:0;cursor:pointer}.sim-prog{color:var(--muted);font-size:13px;margin-top:12px}
.qinput{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:15px;margin:8px 8px 8px 0}

.ord-btns button{background:var(--line);border:0;color:var(--text);border-radius:6px;padding:4px 9px;margin-left:4px;cursor:pointer}
.match-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}.match-row span{flex:1}.match-row select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px}

.drag-zone h4{margin:0 0 8px;font-size:13px;color:var(--muted)}.drag-zone.over{border-color:var(--accent)}.drag-zone .drag-item{margin:4px 4px 0 0;display:inline-block}
video{width:100%;border-radius:12px;background:#000;display:block}
.video-wrap{position:relative}
.cue-overlay{position:absolute;inset:0;background:rgba(15,23,42,.95);border-radius:12px;padding:26px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.idrag-tray{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px;min-height:50px}
.idrag-chip{background:var(--accent);color:#fff;padding:8px 12px;border-radius:8px;cursor:grab;font-size:13px;margin:3px;display:inline-block}
.idrag-stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px}.idrag-stage img{width:100%;display:block}
.idrag-target{position:absolute;border:2px dashed rgba(255,255,255,.55);border-radius:8px;background:rgba(59,130,246,.12);display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:3px;padding:4px}
.idrag-target.over{border-color:var(--accent);background:rgba(59,130,246,.32)}
.idrag-target .t-label{font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px;pointer-events:none;align-self:flex-start}
:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-9999px;top:8px;background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;z-index:50}
.skip-link:focus{left:8px}
.hotspot:focus-visible,.idrag-chip:focus-visible,.drag-item:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}
.kbd-hint{font-size:12px;color:var(--muted);margin-top:10px}
.cert{display:none;background:#fff;color:#1e293b;border-radius:10px;padding:34px 30px;margin-top:20px;text-align:center;border:1px solid #cbd5e1;box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:640px;width:100%}
.cert.show{display:block}
.cert-inner{border:2px solid var(--accent);border-radius:8px;padding:26px 22px}
.cert-logo{max-height:40px;margin:0 auto 14px;display:block}
.cert-kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#64748b;margin:0 0 6px}
.cert-title{font-size:20px;font-weight:800;margin:0 0 18px;color:#0f172a}
.cert-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#64748b;margin:14px 0 2px}
.cert-name{font-size:26px;font-weight:700;margin:0;color:#0f172a;border-bottom:1px solid #cbd5e1;display:inline-block;padding:0 18px 6px}
.cert-course{font-size:15px;font-weight:600;margin:4px 0 0;color:#1e293b}
.cert-meta{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:20px;font-size:12px;color:#475569}
.cert-meta b{display:block;color:#0f172a;font-size:15px}
.cert-ref{margin-top:18px;font-size:10px;color:#94a3b8;word-break:break-all}
.cert-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
@media print{
  body{background:#fff!important;padding:0!important;display:block!important}

}

.drag-tray.armed,.idrag-tray.armed{border-color:#fbbf24}

<script>
const LESSON = {"id":"rma-processing-essentials","title":"RMA Essentials: Submitting & Explaining Returns","passScore":80,"theme":{"accent":"#2563eb","logo":""},"completion":{"rule":"pass"},"report":{"url":"https://script.google.com/macros/s/AKfycbytVPKReGTGu92Hf_tx_J38aM8FGedAlwcG8lCdEDmXnRNXyvCQT1uN8PlE5EUtnkkndw/exec","mode":"json","secret":"rently-courses-2026"},"slides":[{"type":"title","heading":"RMA Essentials","sub":"What an RMA is, when to submit one, and how to set the right expectations with clients"},{"type":"content","heading":"What is an RMA?","body":["**RMA** stands for *Return Merchandise Authorization*. It's the process Rently uses to authorize the return of faulty hardware and get a replacement out to the client.","An RMA covers **hardware only**, and only hardware that was originally purchased through Rently.","A standard RMA ties together three records:","- The **technical support case** documenting the troubleshooting attempted\n- The **Return Record** authorizing the faulty device to come back\n- The **replacement Sales Order** shipping a device to the client"]},{"type":"content","heading":"What the warranty does and doesn't cover","body":["This distinction causes most client friction, so it's worth memorizing.","**Covered:** the hardware itself.","**Not covered:** anything that isn't hardware, including **shipping costs** and **installation fees**.","Two things to keep in mind when you talk to clients: the replacement order is still **priced against the client's current contract** (or list price if they have no contract), and any **credit for the returned device depends on testing** once it reaches our warehouse. So \"under warranty\" does not automatically mean \"no charges.\""]},{"type":"content","heading":"When can you RMA a device?","body":["Three prerequisites:","- **1. A technical support case exists** documenting troubleshooting efforts, and confirming the device is faulty.  \n*unless the client is on the exception list*\n- **2. The hardware was originally purchased through Rently**. We cannot RMA hardware bought elsewhere\n- **3. Only hardware is covered**, with no services such as shipping or installation fees","A missing tech support case is an explicit rejection reason, and the RMA will be sent back to Draft with a Chatter alert to you."]},{"type":"branch","heading":"Scenario: is this eligible?","sub":"A client says a smart lock stopped responding. They mention they bought it themselves from an online retailer because it was cheaper. What do you do?","options":[{"text":"Create the RMA, since it's a device model we sell we should be able to fix or replace it.","correct":false,"feedback":"Not eligible. RMAs can only be completed on hardware **originally purchased through Rently**, regardless of the model."},{"text":"Explain that RMAs only cover hardware purchased through Rently, and discuss purchasing a replacement.","correct":true,"feedback":"Correct. Purchase origin is a hard requirement. You can still help them troubleshoot; you just can't process a warranty replacement."},{"text":"Submit the RMA anyway and let the Orders team decide.","correct":false,"feedback":"This creates rework. Purchase origin is a prerequisite you're expected to check before creating the RMA. Passing it downstream just delays the client and consumes another team's time."}]},{"type":"content","heading":"What happens after you submit an RMA","body":["Your RMA request email is the start of a chain that touches several other teams. Knowing the chain helps you answer \"where is my replacement?\"","- **1. Orders Team**: finds the original order, creates the Return Record, adds the return line items.\n- **2.** The replacement **Sales Order** is generated and the hardware is priced against the client's current contract, then set to *Processing*\n- **3. RevOps**: audits the order in the *All Orders to be Activated* report and either moves it to *Activated* or sends it back to Draft\n- **4. Fulfillment / Warehouse**: verifies the order, then assigns and pairs the replacement devices on the client's behalf\n- **5.** Once the faulty device arrives, the **RMA Specialist / Inventory and Lockbox teams** test it and determines if its creditable, \n- **6.** **Finance** processes any credit in NetSuite"]},{"type":"content","heading":"Why RMAs get sent back","body":["RevOps returns orders to Draft and alerts the submitter via Chatter. The documented rejection reasons include:","- The RMA request has **no associated troubleshooting case**. *This exception doesn't apply to Client-Owned RMAs*\n- The **original order is missing** from the Return Record\n- The **unit price doesn't match**. Note the SOP describes this two ways: matching the client's **current contract price** in the audit steps, and matching the **original order's unit price** in the rejection list\n- The **shipping address is incorrectly formatted or missing**, and we do **not** ship to P.O. Boxes\n- The **shipping contact is missing a phone number**\n- The **shipping price is inaccurate or missing**\n- The item is **discontinued**, or **Quantity on Hand is insufficient**\n- **SaaS** appears on the Return Record\n- Missing **Account Name**, **Account to be Billed**, or **Account to Assign Devices**","On shipping: RevOps verifies the method is **2nd Day Air**. If it's Overnight, they confirm the rate with the fulfillment team."]},{"type":"content","heading":"What happens to the device you send back","body":["When the returned device reaches the warehouse it's tested for **basic functionality** (keypad buttons, key, physical defects), **connectivity** (pairing, responsiveness), **loose or opened parts**, and **whatever fault you described in the RMA**.","That test determines the refund type recorded in NetSuite:","- Device is **creditable** → *Full Refund*\n- Device is **non-creditable** → *No Refund*\n- A shipment with **some creditable and some non-creditable devices** → *Partial Refund*","If nothing is returned at all within the return window, the RMA is closed out with a refund type of *No Refund* or *No Product Received*.","This is why your fault description matters. It tells the warehouse what to look for."]},{"type":"content","heading":"Setting expectations with clients","body":["Five things to say up front, every time:","- **Troubleshooting comes first.** An RMA can't be created until we've documented that we tried to fix it.\n- **The warranty covers hardware only.** Shipping and installation costs are not covered.\n- **The faulty device needs to come back.** The *Account to be Billed* on the order is the account that foots the bill if the faulty item isn't returned to Rently within **30 days**.\n- **We can't ship to P.O. Boxes.** We need a full street address including apt/suite/unit, city, state, postal code and country, plus a working phone number on the shipping contact.\n- **Credit depends on testing.** Whether the client sees a full, partial, or no credit is decided after our warehouse tests the returned device."]},{"type":"dialogue","heading":"Practice: managing a client's expectations","character":{"name":"Alex (Property Manager)","avatar":""},"turns":[{"line":"One of our smart locks is dead. Can you just overnight me a new one? It's under warranty so this should all be free, right?","options":[{"text":"Happy to help. Before I can start a replacement I'll need to run through some troubleshooting with you and document it, since that's required to open the RMA. I should also flag that the warranty covers the hardware itself, but not shipping or installation.","best":true,"feedback":"Ideal. You set both expectations (troubleshooting first, hardware-only warranty) while still sounding helpful."},{"text":"Yes, all completely free. I'll get one shipped out overnight today.","best":false,"feedback":"This sets up a broken promise on three fronts: shipping and installation aren't covered by the warranty, no RMA can be created before troubleshooting is documented, and orders are verified as 2nd Day Air unless the rate for Overnight is confirmed with fulfillment."},{"text":"Warranties don't cover shipping, so there will be a charge.","best":false,"feedback":"Accurate but cold, and it skips the troubleshooting requirement entirely. Lead with help, then set the expectation."}]},{"line":"Okay, we did the troubleshooting and it's definitely dead. What happens next on your end?","options":[{"text":"I'll document everything and submit the RMA. Our Orders team creates the return record and the replacement order, RevOps reviews it, then fulfillment pairs and ships your device. You'll get a return label for the faulty unit too.","best":true,"feedback":"Good. A clear, honest picture of the chain without over-promising a specific date."},{"text":"It ships today.","best":false,"feedback":"You can't promise that. The order passes through Orders, a RevOps audit, and fulfillment before it ships."},{"text":"It's out of my hands now, someone will get to it.","best":false,"feedback":"Technically true but unhelpful. The client is left with no sense of the process or timeline."}]},{"line":"Do I actually have to bother shipping the broken one back? It's garbage anyway.","options":[{"text":"Yes, please do. A return label gets generated for it. If the faulty unit isn't returned to us within 30 days, the account can be billed for the replacement.","best":true,"feedback":"Exactly right, and you gave them the concrete reason rather than just a rule."},{"text":"Don't worry about it, most people don't send them back.","best":false,"feedback":"This exposes the account to being billed for the replacement, and breaks the return and testing process the warehouse depends on."},{"text":"It's company policy.","best":false,"feedback":"A rule with no reason invites pushback. Explaining the 30-day billing consequence is far more persuasive."}]},{"line":"Got it. And will we be credited for the broken lock?","options":[{"text":"Once it arrives, our warehouse tests it and that determines the credit. It could be a full credit, partial, or none depending on its condition. I'll follow up as soon as I know.","best":true,"feedback":"Well handled. You stayed honest about the uncertainty instead of guessing."},{"text":"Yes, you'll get a full credit.","best":false,"feedback":"You can't commit to that. Refund type is decided by the warehouse's diagnostic: full, partial, or none."},{"text":"No, returns aren't credited.","best":false,"feedback":"Also wrong. Creditable devices do receive a full refund; it depends on the test results."}]}]},{"type":"content","heading":"Types of RMAs","body":["- **Standard RMA**: a faulty device with a documented troubleshooting case.\n- **Multi-Device RMA**: normally *every* device must be documented in its **own** RMA. Only the exception clients below may have one RMA covering multiple devices.\n- **Client-Owned RMA**: the client asks for a device to be returned to them **at their own expense**. Created by the CSM from an existing RMA reference number.\n- **Blind Return**: a device arrives with no associated case or RMA record on file.","**Exception clients** who may combine devices into a single RMA: **Progress**, **Main Street Renewal**, and **Kairos**. For these, confirm the device is also logged in that client's RMA tracking spreadsheet."]},{"type":"content","heading":"Blind returns: what to expect","body":["Any device that arrives at Rently without its RMA return label is processed as a blind return. Without the label we cannot match the device to a case, an order, or a client.","-No credit. Blind returns are not eligible for credit.\n-The device is discarded, per Rently policy.\n-The CSM is notified."]},{"type":"dragdrop","heading":"Sort the situations","prompt":"Drag each situation into the right category.","zones":["Standard RMA","Client-Owned RMA","Blind Return","No Product Received"],"items":[{"text":"Faulty lock with a documented tech case","zone":0},{"text":"Device arrives with no case or RMA record on file","zone":2},{"text":"No tech case, tested functional; client pays to get it back","zone":1},{"text":"Client never sent the faulty device back","zone":3}],"feedback":"Not quite. Remember: nothing on file = Blind Return; client pays to have it returned = Client-Owned; nothing came back at all = closed as No Product Received."},{"type":"content","heading":"How to submit an RMA: your steps","body":["Your part is **documentation**. Do it thoroughly and the rest of the chain moves without friction.","- **1.** Attempt all necessary troubleshooting steps for the device with Tech support\n- **2.** Notate the steps attempted and their effectiveness in the case details\n- **3.** Once confirmed faulty, capture the device details (next slide)\n- **4.** Email orders@rently.com using the template","A RMA request with no associated troubleshooting will not be processed."]},{"type":"content","heading":"The details you must capture","body":["Record all four","- **Device Serial Number(s)**\n- **Brief Issue Description**\n- **Tech Support Case #**\n- **Photos/Videos (optional but helpful)**\n- **Shipping address**, We cannot ship to P.O. boxes\nAlso include your **troubleshooting steps and results** and a clear description of the fault. The warehouse uses your fault description to know what to test for."]},{"type":"quiz","heading":"Knowledge check","questions":[{"qtype":"multi","q":"Which of these are required before an RMA can be created? (select all that apply)","options":["A technical support case documenting troubleshooting efforts","The hardware was originally purchased through Rently","The client has been with Rently for at least one year","The device has been confirmed faulty"],"answers":[0,1,3],"feedback":"Tenure is irrelevant. You need a documented troubleshooting case (unless the client is on the exception list), hardware originally purchased through Rently, and the device confirmed faulty before you capture its details."},{"qtype":"truefalse","q":"The warranty covers the hardware as well as the cost of shipping it.","answer":false,"feedback":"False. Only hardware is covered. Additional services such as shipping costs and installation fees are not."},{"qtype":"single","q":"A client bought a lock from a third-party retailer and it's faulty. What can you do?","options":["Process a standard RMA","Process a Client-Owned RMA instead","Explain that RMAs only cover hardware purchased through Rently"],"answer":2,"feedback":"RMAs can only be completed on hardware originally purchased through Rently."},{"qtype":"numeric","q":"The 'Account to be Billed' foots the bill if the faulty item isn't returned to Rently within how many days?","answer":30,"tolerance":0,"feedback":"30 days. That's how the SOP defines the Account to be Billed: the account paying if the faulty item doesn't come back within 30 days."},{"qtype":"multi","q":"Which clients may combine multiple devices into a single RMA? (select all that apply)","options":["Progress","Main Street Renewal","Kairos","All enterprise clients"],"answers":[0,1,2],"feedback":"Only Progress, Main Street Renewal, and Kairos. Every other client needs a separate RMA per device."},{"qtype":"order","q":"Put your documentation steps in the correct order.","items":["Attempt troubleshooting on the device","Note the steps tried and their results in the case","Capture serial number, model, quantity, order number, warranty status","Submit the RMA Request via email to orders@rently.com"],"feedback":"Troubleshoot, document what you tried, capture the device details, then create the child case."},{"qtype":"match","q":"Match each situation to the refund type recorded in NetSuite.","pairs":[{"left":"Returned device tests as creditable","right":"Full Refund"},{"left":"Returned device tests as non-creditable","right":"No Refund"},{"left":"Shipment has creditable and non-creditable devices","right":"Partial Refund"},{"left":"Client never returned anything","right":"No Product Received"}],"feedback":"The warehouse diagnostic sets the refund type. A mixed shipment gets a Partial Refund (with a separate item receipt for the non-creditable devices), and an RMA where nothing came back is closed as No Refund or No Product Received."},{"qtype":"single","q":"Which of these would cause RevOps to send an RMA back to Draft?","options":["The client has more than one property","The Return Record has no associated troubleshooting case","The device is more than a year old"],"answer":1,"feedback":"A missing troubleshooting case is a rejection reason (except on Client-Owned RMAs). Others include a missing original order, mismatched unit price, bad shipping address, or no phone number on the contact."},{"qtype":"truefalse","q":"You should tell a client their credit is guaranteed once they ship the faulty device back.","answer":false,"feedback":"False. Credit depends on the warehouse's diagnostic. It may be full, partial, or none."}]},{"type":"result"}],"certificate":{"issuer":"Rently Learning","enabled":true}};

function emit(event,payload){const msg={source:"lms-module",moduleId:LESSON.id,event,payload};try{if(window.LMS_HOOKS&&typeof window.LMS_HOOKS[event]==='function')window.LMS_HOOKS[event](payload)}catch(e){}try{window.parent&&window.parent.postMessage(msg,"*")}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function mdInline(t){return esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
function mdBlocks(text){return String(text||'').split(/\n\s*\n/).map(function(bl){bl=bl.trim();if(!bl)return '';var lines=bl.split(/\n/);if(lines.every(function(l){return /^\s*-\s+/.test(l);}))return '<ul>'+lines.map(function(l){return '<li>'+mdInline(l.replace(/^\s*-\s+/,''))+'</li>';}).join('')+'</ul>';return '<p>'+lines.map(mdInline).join('<br>')+'</p>';}).join('');}
function shuffle(a){a=(a||[]).slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* Tap or click an item to pick it up, then tap a destination to place it.
   Works on touch devices where HTML5 drag events are unsupported, and
   coexists with mouse drag and the number-key shortcuts. */
function tapToPlace(root,itemSel,dests,onPlace){
  var picked=null;
  function clear(){if(picked)picked.classList.remove('picked');picked=null;dests.forEach(function(d){d.classList.remove('armed');});}
  root.querySelectorAll(itemSel).forEach(function(el){
    el.addEventListener('click',function(ev){
      ev.stopPropagation();
      if(picked===el){clear();announce('Selection cleared');return;}
      if(picked)picked.classList.remove('picked');
      picked=el;el.classList.add('picked');
      dests.forEach(function(d){d.classList.add('armed');});
      announce(el.textContent+' selected. Now choose where to put it.');
    });
  });
  dests.forEach(function(dp){
    dp.addEventListener('click',function(ev){
      if(!picked)return;
      if(picked.contains(ev.target)||picked===ev.target)return;
      var el=picked;dp.appendChild(el);clear();
      if(onPlace)onPlace(el,dp);
    });
  });
}
/* Display order helpers. Shuffling only changes the ORDER things are shown in;
   data-o and data-q always carry the original indices, so scoring is untouched. */
function seqFor(sIdx,n,shuffleOn){
 if(!state.qSeq[sIdx]){const base=[];for(let i=0;i<n;i++)base.push(i);state.qSeq[sIdx]=shuffleOn?shuffle(base):base;}
 return state.qSeq[sIdx];
}
function optOrder(sIdx,qi,n,shuffleOn){
 state.qOrder[sIdx]=state.qOrder[sIdx]||{};
 if(!state.qOrder[sIdx][qi]){const base=[];for(let i=0;i<n;i++)base.push(i);state.qOrder[sIdx][qi]=shuffleOn?shuffle(base):base;}
 return state.qOrder[sIdx][qi];
}

 if(t==='multi')return '<div class="choices">'+order.map(oi=>'<button class="choice" data-q="'+qi+'" data-o="'+oi+'">'+esc((qq.options||[])[oi])+'</button>').join('')+'</div><button class="btn check" data-check="'+qi+'" style="margin-top:12px">Check</button>';
 if(t==='fill')return '<input class="qinput" data-q="'+qi+'" type="text" placeholder="Type your answer"/><button class="btn check" data-check="'+qi+'">Check</button>';
 if(t==='numeric')return '<input class="qinput" data-q="'+qi+'" type="number" placeholder="Enter a number"/><button class="btn check" data-check="'+qi+'">Check</button>';
 if(t==='order')return '<div class="order-list" data-q="'+qi+'">'+shuffle(qq.items||[]).map(it=>'<div class="order-item" data-val="'+esc(it)+'"><span>'+esc(it)+'</span><span class="ord-btns"><button class="ord-up">↑</button><button class="ord-dn">↓</button></span></div>').join('')+'</div><button class="btn check" data-check="'+qi+'" style="margin-top:12px">Check</button>';
 if(t==='match'){const rights=shuffle((qq.pairs||[]).map(p=>p.right));return (qq.pairs||[]).map((p,pi)=>'<div class="match-row"><span>'+esc(p.left)+'</span><select data-mi="'+qi+'-'+pi+'">'+rights.map(r=>'<option>'+esc(r)+'</option>').join('')+'</select></div>').join('')+'<button class="btn check" data-check="'+qi+'" style="margin-top:12px">Check</button>';}
 return '';}

function simController(s){state.simStep[idx]=state.simStep[idx]||0;const steps=s.steps||[];
function advance(){const i=state.simStep[idx];if(i+1<steps.length){state.simStep[idx]=i+1;draw();announce('Step '+(i+2)+' of '+steps.length);}else{state.simDone[idx]=true;const fb=document.getElementById('simFb');fb.className='feedback show ok';fb.textContent='✓ Task complete!';updateNextGate(s);}}

function draw(){const i=state.simStep[idx],step=steps[i],prompt=document.getElementById('simPrompt'),host=document.getElementById('simStage'),prog=document.getElementById('simProg'),fb=document.getElementById('simFb');if(!host)return;if(!step){host.innerHTML='';return;}prompt.textContent=(i+1)+'. '+(step.prompt||'');prog.textContent='Step '+(i+1)+' of '+steps.length;fb.className='feedback';fb.textContent='';host.innerHTML=step.image?'<img class="sim-img" src="'+esc(step.image)+'"/>':lockSVG();const layer=document.createElement('div');layer.className='sim-layer';host.appendChild(layer);layer.onclick=e=>{const r=layer.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;const t=step.target||{x:-1,y:-1,w:0,h:0};const hit=x>=t.x&&x<=t.x+t.w&&y>=t.y&&y<=t.y+t.h;if(hit){emit("interaction",{type:"sim",slide:idx+1,step:i+1,correct:true});if(i+1<steps.length){state.simStep[idx]=i+1;draw();}else{state.simDone[idx]=true;fb.className='feedback show ok';fb.textContent='✓ Task complete!';updateNextGate(s);}}else{emit("interaction",{type:"sim",slide:idx+1,step:i+1,correct:false});const z=(step.zones||[]).find(function(z){return x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h;});fb.className='feedback show no';fb.textContent=(z&&z.feedback)?z.feedback:(step.feedback||'Not quite. Try again.');}};}

function dialogueController(s){state.dialogueStep[idx]=state.dialogueStep[idx]||0;const turns=s.turns||[];const c=s.character||{};

if(s.type==="dragdrop"){const tray=document.getElementById('dragTray');const zonesEl=document.getElementById('dragZones');const fb=document.getElementById('dragFb');const items=(s.items||[]);const zones=(s.zones||[]);tray.innerHTML=shuffle(items.map((it,i)=>i)).map(i=>'<div class="drag-item" draggable="true" tabindex="0" role="button" aria-label="'+esc(items[i].text)+', press a number key to assign a category" data-i="'+i+'">'+esc(items[i].text)+'</div>').join('');zonesEl.innerHTML=zones.map((z,zi)=>'<div class="drag-zone" data-z="'+zi+'" aria-label="Category '+(zi+1)+': '+esc(z)+'"><h4>'+(zi+1)+'. '+esc(z)+'</h4></div>').join('');let dragged=null;stage.querySelectorAll('.drag-item').forEach(el=>{el.addEventListener('dragstart',()=>dragged=el);el.addEventListener('keydown',ev=>{const n=parseInt(ev.key,10);if(n>=1&&n<=zones.length){ev.preventDefault();const z=stage.querySelector('.drag-zone[data-z="'+(n-1)+'"]');if(z){z.appendChild(el);el.focus();announce(el.textContent+' moved to '+zones[n-1]);}}});});const targets=[tray].concat([].slice.call(stage.querySelectorAll('.drag-zone')));targets.forEach(tg=>{tg.addEventListener('dragover',e=>{e.preventDefault();tg.classList.add('over');});tg.addEventListener('dragleave',()=>tg.classList.remove('over'));tg.addEventListener('drop',e=>{e.preventDefault();tg.classList.remove('over');if(dragged)tg.appendChild(dragged);});});
tapToPlace(stage,'.drag-item',targets,function(el,tg){var zi=tg.dataset.z;announce(el.textContent+(zi!==undefined?' moved to '+zones[+zi]:' returned to the tray'));});document.getElementById('dragCheck').onclick=()=>{let ok=true;items.forEach((it,i)=>{const el=stage.querySelector('.drag-item[data-i="'+i+'"]');const zone=el&&el.closest('.drag-zone');const zi=zone?+zone.dataset.z:-1;if(zi!==it.zone)ok=false;});fb.textContent=ok?'✓ All correct!':(s.feedback||'Some items are in the wrong place. Try again.');fb.className='feedback show '+(ok?'ok':'no');if(ok){state.dragDone[idx]=true;updateNextGate(s);}emit("interaction",{type:"dragdrop",slide:idx+1,correct:ok});};}
if(s.type==="imagedrag"){const tray=document.getElementById('idragTray');const stg=document.getElementById('idragStage');const fb=document.getElementById('idragFb');const items=(s.items||[]);const targets=(s.targets||[]);stg.innerHTML=(s.image?'<img src="'+esc(s.image)+'" alt="'+esc(s.alt||s.heading||'Activity image')+'"/>':lockSVG())+targets.map((t,ti)=>'<div class="idrag-target" data-t="'+ti+'" aria-label="Target '+(ti+1)+': '+esc(t.label||'')+'" style="left:'+t.x+'%;top:'+t.y+'%;width:'+t.w+'%;height:'+t.h+'%"><span class="t-label">'+(ti+1)+'. '+esc(t.label||('Target '+(ti+1)))+'</span></div>').join('');tray.innerHTML=shuffle(items.map((it,i)=>i)).map(i=>'<div class="idrag-chip" draggable="true" tabindex="0" role="button" aria-label="'+esc(items[i].text)+', press a number key to place on a target" data-i="'+i+'">'+esc(items[i].text)+'</div>').join('');let dragged=null;stage.querySelectorAll('.idrag-chip').forEach(el=>{el.addEventListener('dragstart',()=>dragged=el);el.addEventListener('keydown',ev=>{const n=parseInt(ev.key,10);if(n>=1&&n<=targets.length){ev.preventDefault();const t=stage.querySelector('.idrag-target[data-t="'+(n-1)+'"]');if(t){t.appendChild(el);el.focus();announce(el.textContent+' placed on '+(targets[n-1].label||('target '+n)));}}});});const drops=[tray].concat([].slice.call(stage.querySelectorAll('.idrag-target')));drops.forEach(dp=>{dp.addEventListener('dragover',e=>{e.preventDefault();dp.classList.add('over');});dp.addEventListener('dragleave',()=>dp.classList.remove('over'));dp.addEventListener('drop',e=>{e.preventDefault();dp.classList.remove('over');if(dragged)dp.appendChild(dragged);});});
tapToPlace(stage,'.idrag-chip',drops,function(el,dp){var ti=dp.dataset.t;announce(el.textContent+(ti!==undefined?' placed on '+((targets[+ti]||{}).label||('target '+(+ti+1))):' returned to the tray'));});document.getElementById('idragCheck').onclick=()=>{let ok=true;items.forEach((it,i)=>{const el=stage.querySelector('.idrag-chip[data-i="'+i+'"]');const tgt=el&&el.closest('.idrag-target');const ti=tgt?+tgt.dataset.t:-1;if(ti!==it.target)ok=false;});fb.textContent=ok?'✓ All correct!':(s.feedback||'Some items are on the wrong spot. Try again.');fb.className='feedback show '+(ok?'ok':'no');if(ok){state.idragDone[idx]=true;updateNextGate(s);}emit("interaction",{type:"imagedrag",slide:idx+1,correct:ok});};}
if(s.type==="video"){const vid=document.getElementById('vid');const overlay=document.getElementById('cueOverlay');if(!vid){state.videoDone[idx]=true;updateNextGate(s);return;}const cues=(s.cues||[]).slice().sort((a,b)=>a.time-b.time);const shown={};vid.addEventListener('timeupdate',()=>{cues.forEach((cue,ci)=>{if(!shown[ci]&&vid.currentTime>=cue.time){shown[ci]=true;vid.pause();showCue(cue);}});});vid.addEventListener('ended',()=>{state.videoDone[idx]=true;updateNextGate(s);});function showCue(cue){overlay.style.display='flex';overlay.innerHTML='<p style="font-weight:600;font-size:16px;margin-top:0">'+esc(cue.q)+'</p><div class="choices">'+(cue.options||[]).map((o,oi)=>'<button class="choice" data-o="'+oi+'">'+esc(o)+'</button>').join('')+'</div><div class="feedback" id="cueFb"></div>';overlay.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const oi=+b.dataset.o;const cfb=document.getElementById('cueFb');const ok=oi===cue.answer;if(ok){cfb.className='feedback show ok';cfb.textContent=cue.feedback||'Correct!';setTimeout(()=>{overlay.style.display='none';vid.play();},600);}else{cfb.className='feedback show no';cfb.textContent=cue.feedback||'Not quite. Try again.';}});}}
}
function updateNextGate(s){if(OPTS.preview){nextBtn.disabled=false;return;}let ok=true;
if(s.type==="hotspot"){const seen=state.hotspotsSeen[idx]||{};ok=Object.keys(seen).length>=(s.spots||[]).length;}
if(s.type==="branch"){ok=!!state.branchDone[idx];}
if(s.type==="quiz"){ok=Object.keys(state.quizAnswers).length>=(s.questions||[]).length;}
if(s.type==="sim"){ok=!!state.simDone[idx]||(s.steps||[]).length===0;}
if(s.type==="dialogue"){ok=!!state.dialogueDone[idx]||(s.turns||[]).length===0;}
if(s.type==="dragdrop"){ok=!!state.dragDone[idx]||(s.items||[]).length===0;}
if(s.type==="imagedrag"){ok=!!state.idragDone[idx]||(s.items||[]).length===0;}
if(s.type==="video"){ok=!!state.videoDone[idx]||!s.src;}
nextBtn.disabled=!ok;}
function computeScore(){const q=LESSON.slides.find(x=>x.type==="quiz");if(!q)return{score:100,passed:true};const total=(q.questions||[]).length||1;const correct=Object.values(state.quizAnswers).filter(Boolean).length;const score=Math.round(correct/total*100);state.score=score;state.passed=score>=(LESSON.passScore||70);return{score,passed:state.passed};}
nextBtn.onclick=()=>{if(idx<LESSON.slides.length-1){idx++;render();}else{finish();}};
prevBtn.onclick=()=>{if(idx>0){idx--;render();}};
function lockSVG(){return '<svg class="media" viewBox="0 0 400 260"><rect width="400" height="260" rx="16" fill="#273549"/><rect x="150" y="30" width="100" height="200" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/><circle cx="200" cy="60" r="10" fill="#334155"/><g fill="#1e293b"><rect x="168" y="90" width="20" height="18" rx="4"/><rect x="190" y="90" width="20" height="18" rx="4"/><rect x="212" y="90" width="20" height="18" rx="4"/><rect x="168" y="112" width="20" height="18" rx="4"/><rect x="190" y="112" width="20" height="18" rx="4"/><rect x="212" y="112" width="20" height="18" rx="4"/></g><circle cx="200" cy="165" r="7" fill="#22c55e"/><rect x="180" y="195" width="40" height="8" rx="4" fill="#334155"/></svg>';}
/* Generated once per completion so the printed certificate and the
   submitted record always carry the same reference. */
function certRef(nm){
  if(state.certRef)return state.certRef;
  var base=(LESSON.id||'module')+'|'+nm+'|'+Date.now();
  var h=0;for(var i=0;i<base.length;i++){h=((h<<5)-h+base.charCodeAt(i))|0;}
  state.certRef=(LESSON.id||'MOD').slice(0,12).toUpperCase()+'-'+Math.abs(h).toString(36).toUpperCase()+'-'+new Date().getFullYear();
  return state.certRef;
}
function showCertificate(nm){
  var box=document.getElementById('certBox');if(!box)return;
  var r=computeScore();
  document.getElementById('certName').textContent=nm;
  document.getElementById('certScore').textContent=r.score+'%';
  document.getElementById('certDate').textContent=new Date().toLocaleDateString();
  document.getElementById('certRef').textContent=certRef(nm);
  box.classList.add('show');
  var pb=document.getElementById('certPrint');
  if(pb)pb.onclick=function(){try{window.print();}catch(e){}};
  try{if(box.scrollIntoView)box.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
  announce('Certificate generated for '+nm);
}
function submitResults(btn){
  var rp=LESSON.report||{};var fb=document.getElementById('repFb');
  var nameEl=document.getElementById('repName'),emailEl=document.getElementById('repEmail');
  var nm=(nameEl&&nameEl.value||'').trim();
  if(!nm){fb.className='feedback show no';fb.textContent='Please enter your name.';if(nameEl)nameEl.focus();return;}
  var cert=LESSON.certificate||{};
  var r=computeScore();
  var wantCert=!!cert.enabled&&r.passed;
  /* No endpoint configured: just issue the certificate. */
  if(!rp.url){
    btn.style.display='none';
    if(wantCert){showCertificate(nm);fb.className='feedback show ok';fb.textContent='✓ Certificate issued below.';}
    return;
  }
  var payload={module:LESSON.title||'',moduleId:LESSON.id||'',name:nm,email:(emailEl&&emailEl.value||'').trim(),score:r.score,passed:r.passed,attempt:state.attempt,completedAt:new Date().toISOString()};
  if(rp.secret)payload.secret=rp.secret;
  if(wantCert)payload.certificateRef=certRef(nm);
  btn.disabled=true;btn.textContent='Submitting…';fb.className='feedback';fb.textContent='';
  var mode=(rp.mode||'json');
  if(mode==='form'){
    var fd=new URLSearchParams();var map=rp.fields||{};
    Object.keys(payload).forEach(function(k){fd.append(map[k]||k,String(payload[k]));});
    fetch(rp.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()})
      .then(function(){done(true);}).catch(function(err){done(false,err&&err.message);});
    return;
  }
  /* JSON mode. Sent as text/plain on purpose: a JSON content type triggers a CORS
     preflight, and Google Apps Script cannot answer preflight requests, so the POST
     would never be sent. Apps Script still reads the body via e.postData.contents. */
  var body=JSON.stringify(payload);
  fetch(rp.url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
    .then(function(res){
      return res.text().then(function(txt){
        var parsed=null;try{parsed=JSON.parse(txt);}catch(e){}
        if(parsed&&parsed.ok===false){done(false,parsed.error||'endpoint rejected the submission');return;}
        if(parsed&&parsed.ok===true){done(true);return;}
        if(res.ok){done(true,null,true);return;}
        done(false,'endpoint responded '+res.status);
      });
    })
    .catch(function(){
      /* Response could not be read, usually a CORS restriction on the reply.
         Resend fire-and-forget so the row is still written, then report unconfirmed. */
      fetch(rp.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body})
        .then(function(){done(true,null,true);})
        .catch(function(err){done(false,err&&err.message);});
    });
  function done(ok,msg,unconfirmed){
    btn.disabled=false;
    if(ok){
      btn.style.display='none';
      fb.className='feedback show ok';
      fb.textContent=unconfirmed
        ? '✓ Results sent. Delivery could not be confirmed from this page, so check with your administrator if you need proof.'
        : '✓ Results submitted. Thank you!';
      emit("results-submitted",payload);
      if(wantCert)showCertificate(nm);
    } else {
      btn.textContent='Retry submission';
      fb.className='feedback show no';
      fb.innerHTML='Could not submit'+(msg?' ('+esc(msg)+')':'')+'. Please try again, or send this to your administrator: <strong>'+esc(nm)+', '+r.score+'%, '+(r.passed?'passed':'not passed')+'</strong>';
      if(wantCert)showCertificate(nm);
    }
  }
}
function pkey(){return 'lms-progress-'+(LESSON.id||'module');}
function saveProgress(){if(OPTS.preview)return;try{if(window.LMS_HOOKS&&window.LMS_HOOKS.saveProgress){window.LMS_HOOKS.saveProgress({idx:idx});return;}localStorage.setItem(pkey(),JSON.stringify({idx:idx}));}catch(e){}}
function loadProgress(){try{if(window.LMS_HOOKS&&window.LMS_HOOKS.loadProgress)return window.LMS_HOOKS.loadProgress();var v=localStorage.getItem(pkey());return v?JSON.parse(v):null;}catch(e){return null;}}
function clearProgress(){try{if(window.LMS_HOOKS&&window.LMS_HOOKS.clearProgress){window.LMS_HOOKS.clearProgress();return;}localStorage.removeItem(pkey());}catch(e){}}
function firstQuizIdx(){for(var i=0;i<LESSON.slides.length;i++)if(LESSON.slides[i].type==='quiz')return i;return 0;}
function showResume(sidx){stage.className="stage center";stage.innerHTML='<div class="badge">Welcome back</div><h2>Resume where you left off?</h2><p class="sub">You were on step '+(sidx+1)+' of '+LESSON.slides.length+'.</p><div style="display:flex;gap:12px;margin-top:10px;justify-content:center"><button class="btn" id="resumeYes">Resume</button><button class="btn ghost" id="resumeNo">Start over</button></div>';prevBtn.style.visibility="hidden";nextBtn.style.visibility="hidden";document.getElementById("resumeYes").onclick=function(){nextBtn.style.visibility="visible";idx=sidx;render();};document.getElementById("resumeNo").onclick=function(){nextBtn.style.visibility="visible";idx=0;clearProgress();render();};}
function maxAttempts(){var m=LESSON.completion&&LESSON.completion.maxAttempts;return (typeof m==='number'&&m>0)?m:0;}
function attemptsLeft(){var m=maxAttempts();return m?Math.max(0,m-state.attempt):Infinity;}
function showRetry(){
  var left=attemptsLeft();
  var wrap=document.createElement("div");wrap.style.marginTop="16px";
  var b=document.createElement("button");b.className="btn";b.textContent="Try again";
  b.onclick=function(){
    state.attempt++;state.quizAnswers={};state.qSeq={};state.qOrder={};
    idx=firstQuizIdx();nextBtn.disabled=false;nextBtn.textContent="Next";render();
  };
  wrap.appendChild(b);
  if(left!==Infinity){var p=document.createElement("p");p.className="sub";p.style.marginTop="10px";
    p.textContent=left===1?"1 attempt remaining.":left+" attempts remaining.";wrap.appendChild(p);}
  stage.appendChild(wrap);
}
function showExhausted(){
  var p=document.createElement("p");p.className="sub";p.style.marginTop="16px";
  p.textContent="You have used all "+maxAttempts()+" attempts. Please contact your administrator to reset this module.";
  stage.appendChild(p);
}
function finish(){
  var r=computeScore();
  if(OPTS.preview){nextBtn.textContent="End of module";return;}
  var rule=(LESSON.completion&&LESSON.completion.rule)||"finish";
  if(rule==="pass"&&!r.passed){
    nextBtn.disabled=true;
    if(attemptsLeft()>0){emit("complete",{score:r.score,passed:false,attempt:state.attempt,final:false});showRetry();}
    else{emit("complete",{score:r.score,passed:false,attempt:state.attempt,final:true});clearProgress();showExhausted();}
  } else {
    emit("complete",{score:r.score,passed:r.passed,attempt:state.attempt,final:true});
    clearProgress();nextBtn.disabled=true;nextBtn.textContent="Completed ✓";
  }
}
(function(){if(OPTS.preview){render();return;}var saved=loadProgress();if(saved&&saved.idx>0&&saved.idx<LESSON.slides.length-1){showResume(saved.idx);}else{render();}})();
</script></body></html>
